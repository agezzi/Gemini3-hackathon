<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuralPlan: Behavioral Productivity Engine</title>
    <meta name="description" content="An expert-level planning tool that analyzes your historical behavior to generate high-probability, burnout-resistant daily plans using AI reasoning." />
    <meta property="og:title" content="NeuralPlan: Behavioral Productivity Engine" />

    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('neuralplan_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'DM Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/open-dyslexic" rel="stylesheet">
    <style>
      :root {
        --np-font-body: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
        --np-letter-spacing: normal;
        --np-word-spacing: normal;
        --np-line-height: 1.55;
      }
      body {
        font-family: var(--np-font-body);
        letter-spacing: var(--np-letter-spacing);
        word-spacing: var(--np-word-spacing);
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      html.np-dyslexia-font .mono {
        font-family: var(--np-font-body);
      }
      html.np-no-italics * {
        font-style: normal !important;
      }
      html.np-reading-relaxed p,
      html.np-reading-relaxed li,
      html.np-reading-relaxed textarea,
      html.np-reading-relaxed input,
      html.np-reading-relaxed span {
        line-height: var(--np-line-height);
      }
      @media print {
        body {
          background-color: #ffffff !important;
          color: #0f172a !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
